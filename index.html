<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Player Search</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 10%, rgba(255,0,35,.22), transparent 30%),
        radial-gradient(circle at 80% 90%, rgba(160,0,25,.18), transparent 35%),
        linear-gradient(135deg, #08090d, #26070d, #09090d);
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 45px 45px;
}

.particles {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #ff2638;
    box-shadow: 0 0 12px #ff2638;
    animation: float linear infinite;
}

@keyframes float {
    from {
        transform: translateY(110vh);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    80% {
        opacity: .5;
    }

    to {
        transform: translateY(-10vh);
        opacity: 0;
    }
}

.container {
    width: min(1050px, 92%);
    margin: auto;
    padding: 40px 0;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo {
    width: 60px;
    height: 60px;
    border-radius: 16px;
    transform: rotate(-7deg);

    display: grid;
    place-items: center;

    background: linear-gradient(145deg, #ff3145, #8d0015);

    border: 1px solid #ff5260;

    box-shadow: 0 0 35px rgba(255,30,50,.4);

    animation: logoPulse 2.5s infinite;
}

.logo::after {
    content: "";
    width: 22px;
    height: 22px;
    background: #09090d;
}

@keyframes logoPulse {
    50% {
        box-shadow: 0 0 60px rgba(255,30,50,.65);
    }
}

h1 {
    margin: 0;
    font-size: 28px;
}

.subtitle {
    margin-top: 5px;
    color: #ff4758;
    font-size: 12px;
    letter-spacing: 2px;
}

.api-status {
    padding: 13px 17px;
    min-width: 210px;

    border: 1px solid #48131c;
    border-radius: 12px;

    background: rgba(10,10,14,.85);
}

.status-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #20d66b;
    box-shadow: 0 0 12px #20d66b;
    margin-right: 7px;
}

.card {
    background: rgba(13,14,19,.94);
    border: 1px solid #47141e;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 25px 70px rgba(0,0,0,.35);
}

.card-title {
    padding: 17px 20px;
    border-bottom: 1px solid #351018;

    color: #ff3a4c;
    font-weight: 900;
    letter-spacing: .7px;
}

.search-area {
    padding: 22px;
}

.search-box {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;

    padding: 16px;

    border-radius: 10px;
    border: 1px solid #4b2029;

    background: #08090d;
    color: white;

    outline: none;

    font-size: 15px;

    transition: .25s;
}

input:focus {
    border-color: #ff2638;
    box-shadow: 0 0 0 3px rgba(255,38,56,.1);
}

button {
    border: 0;
    border-radius: 10px;

    padding: 0 25px;

    background: linear-gradient(100deg, #a90018, #ff2638, #a90018);
    background-size: 200%;

    color: white;
    font-weight: 900;

    cursor: pointer;

    transition: .25s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(255,30,50,.35);
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

.help {
    color: #858996;
    font-size: 12px;
    margin-top: 9px;
}

.loading {
    display: none;
    text-align: center;
    padding: 45px;
}

.loading.active {
    display: block;
}

.spinner {
    width: 65px;
    height: 65px;

    margin: auto;

    border: 3px solid #391019;
    border-top-color: #ff2638;
    border-right-color: #ff2638;

    border-radius: 50%;

    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.loading h2 {
    color: #ff3346;
}

.loading p {
    color: #777b88;
}

.result {
    display: none;
    margin-top: 20px;
}

.result.active {
    display: block;
    animation: resultIn .4s ease;
}

@keyframes resultIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.profile {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 25px;
    border-bottom: 1px solid #301017;
}

.avatar {
    width: 110px;
    height: 110px;

    object-fit: cover;

    border-radius: 16px;

    border: 2px solid #ff2638;

    background: #08090d;

    box-shadow: 0 0 30px rgba(255,30,50,.2);
}

.profile-name {
    font-size: 24px;
    font-weight: 900;
}

.username {
    color: #ff4758;
    margin-top: 5px;
}

.badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.badge {
    padding: 6px 10px;
    border-radius: 999px;

    font-size: 11px;
    font-weight: bold;

    background: #171015;
    border: 1px solid #4b1821;
}

.online {
    color: #47e987;
}

.offline {
    color: #999;
}

.details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 22px;
}

.detail {
    padding: 15px;

    border-radius: 11px;

    background: #090a0e;

    border: 1px solid #2c1319;

    transition: .2s;
}

.detail:hover {
    transform: translateY(-2px);
    border-color: #5a1a25;
}

.detail span {
    display: block;
    color: #777b88;
    font-size: 11px;
    margin-bottom: 7px;
}

.detail strong {
    word-break: break-word;
}

.description {
    margin: 0 22px 22px;
    padding: 16px;

    border: 1px solid #2c1319;
    border-radius: 11px;

    background: #090a0e;

    color: #bbb;
    line-height: 1.5;
}

.description-title {
    color: #ff3b4d;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 8px;
}

.error {
    padding: 22px;
    color: #ff6975;
}

.raw {
    margin-top: 20px;
}

.raw pre {
    margin: 0;
    padding: 18px;

    max-height: 350px;
    overflow: auto;

    background: #050609;

    border: 1px solid #291117;
    border-radius: 11px;

    color: #b9ffc8;

    font: 12px/1.5 Consolas, monospace;
}

.copy {
    float: right;
    padding: 7px 11px;
    font-size: 11px;
}

@media(max-width: 650px) {

    .header {
        flex-direction: column;
        align-items: flex-start;
    }

    .api-status {
        width: 100%;
    }

    .search-box {
        flex-direction: column;
    }

    button {
        padding: 15px;
    }

    .profile {
        flex-direction: column;
        text-align: center;
    }

    .details {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="particles" id="particles"></div>

<div class="container">

    <div class="header">

        <div class="logo-area">

            <div class="logo"></div>

            <div>
                <h1>ROBLOX USER SEARCH</h1>

                <div class="subtitle">
                    PLAYER LOOKUP • ROBLOX API
                </div>
            </div>

        </div>

        <div class="api-status">

            <span class="status-dot"></span>

            <b id="apiStatus">
                LISTO
            </b>

            <br>

            <small style="color:#777">
                /api/roblox
            </small>

        </div>

    </div>


    <div class="card">

        <div class="card-title">
            🔎 BUSCAR JUGADOR
        </div>

        <div class="search-area">

            <div class="search-box">

                <input
                    id="username"
                    type="text"
                    maxlength="20"
                    placeholder="Escribe el username..."
                    autocomplete="off"
                >

                <button
                    id="searchButton"
                    onclick="searchPlayer()"
                >
                    BUSCAR
                </button>

            </div>

            <div class="help">
                Busca por nombre de usuario y obtiene información pública del jugador.
            </div>

        </div>

    </div>


    <div
        class="card result"
        id="result"
    >

        <div class="card-title">
            ◈ INFORMACIÓN DEL USUARIO
        </div>


        <div
            class="loading"
            id="loading"
        >

            <div class="spinner"></div>

            <h2>
                BUSCANDO JUGADOR...
            </h2>

            <p>
                Consultando Roblox
            </p>

        </div>


        <div id="resultContent"></div>

    </div>


    <div
        class="card raw"
        id="rawCard"
        style="display:none"
    >

        <div class="card-title">

            📡 RESPUESTA JSON

            <button
                class="copy"
                onclick="copyJson()"
            >
                COPIAR
            </button>

        </div>

        <pre id="rawJson"></pre>

    </div>

</div>


<script>

const input =
    document.getElementById("username");

const button =
    document.getElementById("searchButton");

const result =
    document.getElementById("result");

const loading =
    document.getElementById("loading");

const content =
    document.getElementById("resultContent");

const rawCard =
    document.getElementById("rawCard");

const rawJson =
    document.getElementById("rawJson");

const apiStatus =
    document.getElementById("apiStatus");


/* Partículas */

for(let i = 0; i < 35; i++){

    const particle =
        document.createElement("div");

    particle.className =
        "particle";

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.animationDuration =
        (6 + Math.random() * 10) + "s";

    particle.style.animationDelay =
        (-Math.random() * 15) + "s";

    document
        .getElementById("particles")
        .appendChild(particle);
}


/* Enter */

input.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            searchPlayer();
        }

    }
);


/* Escape HTML */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* Buscar */

async function searchPlayer(){

    const username =
        input.value.trim();


    if(!username){

        content.innerHTML =
            `<div class="error">
                ❌ Escribe un nombre de usuario.
            </div>`;

        result.classList.add("active");

        return;
    }


    button.disabled = true;

    button.textContent =
        "BUSCANDO...";

    apiStatus.textContent =
        "BUSCANDO...";


    result.classList.add("active");

    loading.classList.add("active");

    content.innerHTML = "";

    rawCard.style.display =
        "none";


    try{

        const response =
            await fetch(
                "/api/roblox?username=" +
                encodeURIComponent(username)
            );


        const data =
            await response.json();


        rawJson.textContent =
            JSON.stringify(
                data,
                null,
                2
            );

        rawCard.style.display =
            "block";


        if(!response.ok){

            throw new Error(
                data.error ||
                "Error HTTP " +
                response.status
            );
        }


        if(!data.user){

            content.innerHTML =
                `<div class="error">
                    ❌ No se encontró el usuario
                    <b>${escapeHTML(username)}</b>.
                </div>`;

            apiStatus.textContent =
                "NO ENCONTRADO";

            return;
        }


        const user =
            data.user;

        const presence =
            data.presence || {};

        const avatar =
            data.avatar || {};


        let statusText =
            "⚫ OFFLINE";

        let statusClass =
            "offline";


        if(presence.userPresenceType === 1){

            statusText =
                "🟢 ONLINE";

            statusClass =
                "online";

        }
        else if(
            presence.userPresenceType === 2
        ){

            statusText =
                "🎮 EN JUEGO";

            statusClass =
                "online";

        }
        else if(
            presence.userPresenceType === 3
        ){

            statusText =
                "🛠️ EN ROBLOX STUDIO";

            statusClass =
                "online";

        }


        content.innerHTML = `

            <div class="profile">

                <img
                    class="avatar"
                    src="${escapeHTML(
                        avatar.imageUrl || ""
                    )}"
                    alt="Avatar"
                    onerror="
                        this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22110%22 height=%22110%22><rect width=%22110%22 height=%22110%22 fill=%22%23101014%22/></svg>'
                    "
                >

                <div>

                    <div class="profile-name">
                        ${escapeHTML(
                            user.displayName
                        )}
                    </div>

                    <div class="username">
                        @${escapeHTML(
                            user.name
                        )}
                    </div>

                    <div class="badges">

                        <span
                            class="badge ${statusClass}"
                        >
                            ${statusText}
                        </span>

                        ${
                            user.hasVerifiedBadge
                            ?
                            `<span class="badge">
                                ✓ VERIFICADO
                            </span>`
                            :
                            ""
                        }

                        ${
                            user.isBanned
                            ?
                            `<span class="badge">
                                ⚠️ BANEADO
                            </span>`
                            :
                            ""
                        }

                    </div>

                </div>

            </div>


            <div class="details">

                <div class="detail">
                    <span>USER ID</span>
                    <strong>
                        ${user.id}
                    </strong>
                </div>


                <div class="detail">
                    <span>USERNAME</span>
                    <strong>
                        ${escapeHTML(
                            user.name
                        )}
                    </strong>
                </div>


                <div class="detail">
                    <span>DISPLAY NAME</span>
                    <strong>
                        ${escapeHTML(
                            user.displayName
                        )}
                    </strong>
                </div>


                <div class="detail">
                    <span>ESTADO</span>
                    <strong>
                        ${statusText}
                    </strong>
                </div>


                <div class="detail">
                    <span>JUEGO / UBICACIÓN</span>
                    <strong>
                        ${escapeHTML(
                            presence.lastLocation ||
                            "No está jugando"
                        )}
                    </strong>
                </div>


                <div class="detail">
                    <span>PLACE ID</span>
                    <strong>
                        ${
                            presence.placeId ||
                            "—"
                        }
                    </strong>
                </div>


                <div class="detail">
                    <span>ROOT PLACE ID</span>
                    <strong>
                        ${
                            presence.rootPlaceId ||
                            "—"
                        }
                    </strong>
                </div>


                <div class="detail">
                    <span>GAME ID</span>
                    <strong>
                        ${escapeHTML(
                            presence.gameId ||
                            "—"
                        )}
                    </strong>
                </div>


                <div class="detail">
                    <span>FECHA DE CREACIÓN</span>
                    <strong>
                        ${escapeHTML(
                            user.created ||
                            "—"
                        )}
                    </strong>
                </div>


                <div class="detail">
                    <span>TIPO DE PRESENCIA</span>
                    <strong>
                        ${
                            presence.userPresenceType ??
                            "—"
                        }
                    </strong>
                </div>

            </div>


            ${
                user.description
                ?
                `<div class="description">

                    <div class="description-title">
                        📝 DESCRIPCIÓN
                    </div>

                    ${escapeHTML(
                        user.description
                    )}

                </div>`
                :
                ""
            }

        `;


        apiStatus.textContent =
            "ENCONTRADO";


    }
    catch(error){

        content.innerHTML =
            `<div class="error">

                ❌ Error al consultar.

                <br><br>

                <small>
                    ${escapeHTML(
                        error.message
                    )}
                </small>

            </div>`;


        apiStatus.textContent =
            "ERROR";

    }
    finally{

        loading.classList.remove(
            "active"
        );

        button.disabled = false;

        button.textContent =
            "BUSCAR";
    }
}


/* Copiar JSON */

async function copyJson(){

    try{

        await navigator
            .clipboard
            .writeText(
                rawJson.textContent
            );

    }catch(error){

        console.log(error);

    }

}

</script>

</body>
</html>
