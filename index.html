<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Roblox Users API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111318;
      color: #fff;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
    .box {
      background: #1b1e25;
      border-radius: 12px;
      padding: 20px;
    }
    input, button {
      padding: 12px;
      border-radius: 8px;
      border: 0;
      font-size: 15px;
    }
    input { width: 120px; }
    button {
      cursor: pointer;
      background: #00a2ff;
      color: white;
      margin-left: 8px;
    }
    pre {
      background: #0b0d11;
      padding: 15px;
      border-radius: 8px;
      overflow: auto;
      white-space: pre-wrap;
    }
    #status { margin: 15px 0; }
  </style>
</head>
<body>
  <div class="box">
    <h2>🔎 Prueba de users.roblox.com</h2>
    <p>Introduce un User ID para comprobar si la API responde desde tu navegador.</p>

    <input id="userId" type="number" value="1" min="1">
    <button onclick="probarAPI()">Probar API</button>

    <div id="status">Esperando prueba...</div>
    <pre id="resultado">Aquí aparecerá la respuesta.</pre>
  </div>

<script>
async function probarAPI() {
  const userId = Number(document.getElementById("userId").value);
  const status = document.getElementById("status");
  const resultado = document.getElementById("resultado");

  if (!userId || userId < 1) {
    status.textContent = "❌ Introduce un User ID válido.";
    return;
  }

  status.textContent = "⏳ Enviando petición...";
  resultado.textContent = "";

  try {
    const response = await fetch("https://users.roblox.com/v1/users", {
      method: "POST",
      headers: {
        "accept": "application/json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        userIds: [userId],
        excludeBannedUsers: true
      })
    });

    const text = await response.text();

    let data;
    try {
      data = JSON.parse(text);
    } catch {
      data = text;
    }

    status.textContent = response.ok
      ? `✅ Funcionó — HTTP ${response.status}`
      : `⚠️ Roblox respondió HTTP ${response.status}`;

    resultado.textContent = typeof data === "string"
      ? data
      : JSON.stringify(data, null, 2);

  } catch (error) {
    status.textContent = "❌ La petición fue bloqueada o falló.";
    resultado.textContent =
      "Error: " + error.message +
      "\n\nSi aparece 'Failed to fetch', normalmente significa que el navegador bloqueó la petición por CORS o hubo un problema de conexión.";
  }
}
</script>
</body>
</html>
