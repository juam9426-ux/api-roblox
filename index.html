<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox User Search</title>
<style>
*{box-sizing:border-box}
:root{--red:#ff2638;--red2:#a90018;--bg:#07080c;--panel:#101219;--line:#3c121a;--muted:#9296a3}
body{margin:0;min-height:100vh;color:#f5f5f7;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 15% 5%,rgba(255,25,45,.22),transparent 30%),radial-gradient(circle at 85% 90%,rgba(180,0,25,.16),transparent 35%),linear-gradient(135deg,#08090d,#21070c 50%,#07080c);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:44px 44px}
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden}.p{position:absolute;width:3px;height:3px;background:#ff3042;border-radius:50%;box-shadow:0 0 12px #ff3042;animation:float linear infinite}
@keyframes float{from{transform:translateY(110vh);opacity:0}20%{opacity:.8}80%{opacity:.5}to{transform:translateY(-10vh);opacity:0}}
.wrap{width:min(1120px,92%);margin:auto;padding:35px 0}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:15px}
.logo{width:58px;height:58px;background:linear-gradient(145deg,#ff3447,#8b0015);border:1px solid #ff5260;border-radius:15px;display:grid;place-items:center;transform:rotate(-7deg);box-shadow:0 0 35px rgba(255,30,50,.35);animation:pulse 2.5s infinite}
.logo:after{content:"";width:20px;height:20px;background:#08090d}
@keyframes pulse{50%{box-shadow:0 0 55px rgba(255,30,50,.6)}}
h1{font-size:28px;margin:0}.sub{color:#ff4c5b;font-size:12px;letter-spacing:2px;margin-top:4px}
.status{border:1px solid #49151e;background:#0d0b0f;border-radius:12px;padding:12px 16px;min-width:220px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff2638;box-shadow:0 0 12px #ff2638;margin-right:7px}
.card{background:rgba(14,15,21,.9);border:1px solid #45131c;border-radius:16px;overflow:hidden;box-shadow:0 25px 70px rgba(0,0,0,.3)}.head{padding:17px 20px;border-bottom:1px solid #341018;color:#ff394b;font-weight:900;letter-spacing:.7px}.pad{padding:22px}
.search{display:flex;gap:10px}.search input{flex:1}
input{width:100%;padding:15px;border-radius:10px;border:1px solid #48202a;background:#08090d;color:#fff;outline:none;font-size:15px;transition:.25s}
input:focus{border-color:#ff2638;box-shadow:0 0 0 3px rgba(255,38,56,.1)}
button{border:0;border-radius:10px;color:white;font-weight:900;cursor:pointer;background:linear-gradient(100deg,#a90018,#ff2638,#a90018);background-size:200%;box-shadow:0 0 25px rgba(255,30,50,.2);transition:.25s}
button:hover{transform:translateY(-2px);box-shadow:0 0 35px rgba(255,30,50,.38)}.search button{padding:0 25px;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:200%}}
.help{color:var(--muted);font-size:12px;margin-top:8px}.loader{text-align:center;padding:45px;display:none}.loader.show{display:block}
.ring{width:75px;height:75px;border:2px solid #411019;border-top-color:#ff2638;border-right-color:#ff2638;border-radius:50%;margin:auto;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}.loader h2{color:#ff3548}.loader p{color:var(--muted)}
.results{margin-top:18px;display:none}.results.show{display:block}
.profile{display:flex;gap:18px;align-items:center;padding:20px;border-bottom:1px solid #301017}.avatar{width:88px;height:88px;border-radius:14px;object-fit:cover;background:#08090d;border:1px solid #54131e;box-shadow:0 0 25px rgba(255,30,50,.15)}
.name{font-size:22px;font-weight:900}.username{color:#ff4a59;margin-top:4px}.verified{display:inline-block;margin-top:9px;padding:5px 9px;border-radius:999px;background:#171015;border:1px solid #4b1821;color:#ff7b86;font-size:11px}
.details{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:20px}.detail{background:#090a0e;border:1px solid #291218;border-radius:10px;padding:14px}.detail span{display:block;color:#818591;font-size:11px;margin-bottom:6px}.detail b{word-break:break-all}
.error{padding:20px;color:#ff6975}.raw{padding:0 20px 20px}.raw pre{margin:0;background:#06070a;border:1px solid #281219;border-radius:10px;padding:15px;color:#b9ffca;overflow:auto;max-height:300px;font:12px/1.5 Consolas,monospace}
@media(max-width:650px){header{align-items:flex-start;flex-direction:column}.status{width:100%}.search{flex-direction:column}.search button{padding:14px}.details{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="wrap">
<header>
 <div class="brand"><div class="logo"></div><div><h1>ROBLOX USER SEARCH</h1><div class="sub">USER LOOKUP • OFFICIAL API</div></div></div>
 <div class="status"><span class="dot"></span><b id="status">LISTO</b><br><small style="color:#777">users.roblox.com/v1/usernames/users</small></div>
</header>

<section class="card">
 <div class="head">🔎 BUSCAR JUGADOR</div>
 <div class="pad">
  <div class="search">
   <input id="username" placeholder="Escribe un nombre de usuario..." autocomplete="off">
   <button onclick="buscar()">BUSCAR</button>
  </div>
  <div class="help">Busca por nombre de usuario y consulta su User ID, Display Name y avatar.</div>
 </div>
</section>

<section class="card results" id="results">
 <div class="head">◈ INFORMACIÓN DEL USUARIO</div>
 <div id="content"></div>
</section>

<section class="card" style="margin-top:18px">
 <div class="head">📡 RESPUESTA RAW</div>
 <div class="loader" id="loader"><div class="ring"></div><h2>BUSCANDO...</h2><p>Consultando users.roblox.com</p></div>
 <div class="raw"><pre id="raw">{}</pre></div>
</section>
</div>

<script>
for(let i=0;i<32;i++){const p=document.createElement("i");p.className="p";p.style.left=Math.random()*100+"%";p.style.animationDuration=(6+Math.random()*10)+"s";p.style.animationDelay=(-Math.random()*12)+"s";document.getElementById("particles").appendChild(p)}
const input=document.getElementById("username");
input.addEventListener("keydown",e=>{if(e.key==="Enter")buscar()});

async function buscar(){
 const username=input.value.trim();
 const loader=document.getElementById("loader"), results=document.getElementById("results");
 const content=document.getElementById("content"), raw=document.getElementById("raw");
 if(!username){alert("Escribe un nombre de usuario.");return}
 loader.classList.add("show");results.classList.remove("show");content.innerHTML="";raw.textContent="";document.getElementById("status").textContent="BUSCANDO...";
 const start=performance.now();
 try{
  const res=await fetch("https://users.roblox.com/v1/usernames/users",{method:"POST",headers:{"Accept":"application/json","Content-Type":"application/json"},body:JSON.stringify({usernames:[username],excludeBannedUsers:true})});
  const data=await res.json();raw.textContent=JSON.stringify(data,null,2);
  if(!res.ok)throw new Error("HTTP "+res.status);
  if(!data.data||!data.data.length){
   content.innerHTML='<div class="error">✕ No se encontró ningún usuario con ese nombre.</div>';
   results.classList.add("show");document.getElementById("status").textContent="NO ENCONTRADO";return;
  }
  const u=data.data[0];
  let avatar="";
  try{
   const ar=await fetch("https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds="+u.id+"&size=150x150&format=Png&isCircular=false");
   const ad=await ar.json();avatar=ad.data?.[0]?.imageUrl||"";
  }catch{}
  const badge=u.hasVerifiedBadge?'✓ VERIFICADO':'USUARIO';
  content.innerHTML=`
   <div class="profile">
    <img class="avatar" src="${avatar}" onerror="this.style.visibility='hidden'">
    <div><div class="name">${esc(u.displayName)}</div><div class="username">@${esc(u.name)}</div><span class="verified">${badge}</span></div>
   </div>
   <div class="details">
    <div class="detail"><span>USER ID</span><b>${u.id}</b></div>
    <div class="detail"><span>USERNAME</span><b>${esc(u.name)}</b></div>
    <div class="detail"><span>DISPLAY NAME</span><b>${esc(u.displayName)}</b></div>
    <div class="detail"><span>TIEMPO DE RESPUESTA</span><b>${Math.round(performance.now()-start)} ms</b></div>
   </div>`;
  results.classList.add("show");document.getElementById("status").textContent="COMPLETADO";
 }catch(e){
  raw.textContent="ERROR: "+e.message+"\n\nSi aparece 'Failed to fetch', el navegador puede estar bloqueando la petición por CORS.";
  content.innerHTML='<div class="error">✕ No se pudo completar la consulta.<br><small>'+esc(e.message)+'</small></div>';
  results.classList.add("show");document.getElementById("status").textContent="FALLÓ";
 }finally{loader.classList.remove("show")}
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script>
</body>
</html>
